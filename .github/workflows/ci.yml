name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release]
    runs-on: windows-latest
    env:
      VCPKG_ROOT: C:\vcpkg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check generated protocol models
        run: python tools/generate_models.py --check
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }} -E testhost --output-on-failure --timeout 60

  testhost:
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release]
    runs-on: windows-latest
    env:
      VCPKG_ROOT: C:\vcpkg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Nanahuse/LiveSplit.Bridge
          ref: 4c14c0161eacd50b05411c0d20f5eff523e9c155
          submodules: recursive
          path: .testhost/LiveSplit.Bridge
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build TestHost
        run: dotnet build .testhost/LiveSplit.Bridge/tests/LiveSplit.Bridge.TestHost/LiveSplit.Bridge.TestHost.csproj --configuration Release
      - name: Register TestHost
        shell: pwsh
        run: |
          "LIVESPLIT_BRIDGE_TESTHOST=$env:GITHUB_WORKSPACE\.testhost\LiveSplit.Bridge\tests\LiveSplit.Bridge.TestHost\bin\Release\net4.8.1\LiveSplit.Bridge.TestHost.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: TestHost integration
        run: ctest --preset ${{ matrix.preset }} -R testhost --output-on-failure --timeout 180
